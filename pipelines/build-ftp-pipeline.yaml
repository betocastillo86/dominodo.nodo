trigger:
  branches:
    include: [ 'main', 'develop' ]
    exclude: [ 'refs/pull/*/merge' ]
pr:
  branches:
    exclude: [ '*' ]

pool:
  vmImage: 'ubuntu-latest'

variables:
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - group: dominodo-nodo-prod       # FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_DIR
    - name: BUILD_CONFIG
      value: production
  - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
    - group: dominodo-nodo-stage      # FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_DIR
    - name: BUILD_CONFIG
      value: stage

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js 20'

  - script: npm ci
    displayName: 'npm ci (respects .npmrc legacy-peer-deps)'

  # Stamp the release id into the bundle AND into the published version.json, so
  # VersionCheckService can compare them and prompt long-lived tabs to reload.
  # Must run before the build: `public/` is copied and the .ts is compiled by it.
  - script: |
      set -e
      sed -i "s/___buildid___/$BUILD_BUILDID/g" \
        src/app/core/version/app-version.ts \
        public/version.json
      echo "Stamped build $BUILD_BUILDID"
      cat public/version.json
    displayName: 'Stamp build version'

  - script: npx ng build --configuration $(BUILD_CONFIG)
    displayName: 'Build Angular ($(BUILD_CONFIG))'

  - task: FtpUpload@2
    displayName: 'FTP Upload to $(FTP_REMOTE_DIR)'
    inputs:
      credentialsOption: 'inputs'
      serverUrl: '$(FTP_HOST)'          # e.g. ftp://winXXXX.site4now.net/
      username: '$(FTP_USERNAME)'
      password: '$(FTP_PASSWORD)'
      rootDirectory: '$(Build.SourcesDirectory)/dist/dominodo-nodo/browser'
      filePatterns: '**'
      remoteDirectory: '$(FTP_REMOTE_DIR)'   # e.g. /dominodonodo/ or /dominodonodo-stage/
      clean: false
      preservePaths: true
