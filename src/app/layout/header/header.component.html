<div class="container-xl">
  <!-- Tenant branding -->
  <a class="navbar-brand d-inline-flex align-items-center gap-2 pe-0 pe-md-3">
    @if (tenant.logoUrl(); as logo) {
      <img [src]="logo" [alt]="tenant.name() ?? 'Logo'" class="navbar-brand-image" height="32" />
    } @else {
      <tabler-icon name="building-community" class="text-primary"></tabler-icon>
    }
    <span>{{ tenant.name() ?? 'Dominodo' }}</span>
  </a>

  <!-- User menu -->
  <div class="navbar-nav flex-row order-md-last">
    <div class="nav-item" ngbDropdown placement="bottom-end">
      <a class="nav-link d-flex lh-1 text-reset p-0" role="button" ngbDropdownToggle id="user-menu">
        <span class="avatar avatar-sm">
          <tabler-icon name="user-circle"></tabler-icon>
        </span>
        <div class="d-none d-xl-block ps-2">
          <div>{{ authStore.user()?.name || 'Usuario' }}</div>
          @if (authStore.user()?.roleName) {
            <div class="mt-1 small text-secondary">{{ authStore.user()?.roleName }}</div>
          }
        </div>
      </a>
      <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end" aria-labelledby="user-menu">
        <button type="button" class="dropdown-item" (click)="logout()">
          <tabler-icon name="logout" class="me-2"></tabler-icon>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</div>
