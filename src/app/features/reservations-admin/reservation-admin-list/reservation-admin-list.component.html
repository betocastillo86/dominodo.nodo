<app-page-header title="Reservas" pretitle="Áreas sociales" />

<div class="card">
  <div class="card-header d-block">
    <!--
      Shortcuts over the filters below. Each writes the window it means into the
      date fields, so what it did stays visible — and editable from there.
    -->
    <div class="btn-group btn-group-sm mb-3" role="group" aria-label="Filtros rápidos">
      @for (view of quickViews; track view.key) {
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-primary]="quickView() === view.key"
          [attr.aria-pressed]="quickView() === view.key"
          [title]="view.hint"
          (click)="toggleQuickView(view.key)"
        >
          {{ view.label }}
        </button>
      }
    </div>

    <div class="row g-2 w-100">
      <div class="col-6 col-lg-2">
        <label class="form-label mb-1" for="reservations-from">Desde</label>
        <input id="reservations-from" type="date" class="form-control" [formControl]="fromControl" />
      </div>
      <div class="col-6 col-lg-2">
        <label class="form-label mb-1" for="reservations-to">Hasta</label>
        <input id="reservations-to" type="date" class="form-control" [formControl]="toControl" />
      </div>
      <div class="col-12 col-lg-2">
        <label class="form-label mb-1" for="reservations-status">Estado</label>
        <select id="reservations-status" class="form-select" [formControl]="statusControl">
          <option value="">Todos los estados</option>
          @for (status of statuses; track status) {
            <option [value]="status">{{ statusLabel[status] }}</option>
          }
        </select>
      </div>
      <div class="col-12 col-lg">
        <label class="form-label mb-1" for="reservations-area">Área social</label>
        <select id="reservations-area" class="form-select" [formControl]="amenityControl">
          <option value="">Todas las áreas</option>
          @for (area of areas(); track area.id) {
            <option [value]="area.id">{{ area.name }}</option>
          }
        </select>
      </div>
      <div class="col-12 col-lg">
        <label class="form-label mb-1">Apartamento</label>
        <app-search-select
          [formControl]="apartmentControl"
          [search]="searchApartments"
          [resolve]="resolveApartment"
          placeholder="Buscar por apartamento"
          clearLabel="Quitar filtro de apartamento"
        />
      </div>
    </div>
  </div>

  <app-data-table
    [columns]="columns()"
    [rows]="items()"
    [paging]="paging()"
    [loading]="loading()"
    [error]="error()"
    [rowKey]="rowKey"
    [actionLink]="detailLink"
    actionIcon="eye"
    (pageChange)="onPageChange($event)"
  />
</div>

<!--
  The "Estado" cell. It is a control rather than a value, so it reaches the
  generic table as a template: picking a state opens the shared dialog with that
  state already chosen, the reason still to be written there.
-->
<ng-template #statusCell let-reservation>
  <app-reservation-status-select
    [reservation]="reservation"
    (actionPicked)="respond.open(reservation, $event)"
  />
</ng-template>

<!-- Renders only its dialog; the status select above is its only trigger here. -->
<app-reservation-respond #respond (responded)="onResponded()" />
