<app-page-header title="Reservas" pretitle="Áreas sociales" />

<div class="card">
  <div class="card-header">
    <div class="row g-2 w-100">
      <div class="col-6 col-lg-2">
        <label class="form-label mb-1" for="reservations-from">Desde</label>
        <input id="reservations-from" type="date" class="form-control" [formControl]="fromControl" />
      </div>
      <div class="col-6 col-lg-2">
        <label class="form-label mb-1" for="reservations-to">Hasta</label>
        <input id="reservations-to" type="date" class="form-control" [formControl]="toControl" />
      </div>
      <div class="col-12 col-lg-2">
        <label class="form-label mb-1" for="reservations-status">Estado</label>
        <select id="reservations-status" class="form-select" [formControl]="statusControl">
          <option value="">Todos los estados</option>
          @for (status of statuses; track status) {
            <option [value]="status">{{ statusLabel[status] }}</option>
          }
        </select>
      </div>
      <div class="col-12 col-lg">
        <label class="form-label mb-1" for="reservations-area">Área social</label>
        <select id="reservations-area" class="form-select" [formControl]="amenityControl">
          <option value="">Todas las áreas</option>
          @for (area of areas(); track area.id) {
            <option [value]="area.id">{{ area.name }}</option>
          }
        </select>
      </div>
      <div class="col-12 col-lg">
        <label class="form-label mb-1">Apartamento</label>
        <app-search-select
          [formControl]="apartmentControl"
          [search]="searchApartments"
          [resolve]="resolveApartment"
          placeholder="Buscar por apartamento"
          clearLabel="Quitar filtro de apartamento"
        />
      </div>
    </div>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="items()"
    [paging]="paging()"
    [loading]="loading()"
    [error]="error()"
    [rowKey]="rowKey"
    [actionLink]="detailLink"
    actionIcon="eye"
    rowActionIcon="message-reply"
    rowActionLabel="Responder la reserva"
    [rowActionVisible]="canRespond"
    (rowAction)="respond.open($event)"
    (pageChange)="onPageChange($event)"
  />
</div>

<!-- Renders only its dialog; the row action above is its trigger here. -->
<app-reservation-respond #respond (responded)="onResponded()" />
