<app-page-header title="Apartamentos" pretitle="Conjunto">
  @if (canImport()) {
    <div actions>
      <a routerLink="/apartments/import" class="btn btn-primary">
        <tabler-icon name="upload" class="me-1" />
        Carga masiva
      </a>
    </div>
  }
</app-page-header>

<div class="card">
  <div class="card-header">
    <div class="row g-2 w-100">
      <!-- Only when the conjunto declared towers: with none there is nothing to
           pick, and a role without `tenant.info` never gets the list at all. -->
      @if (towers().length) {
        <div class="col-12 col-lg-3">
          <select class="form-select" [formControl]="towerControl" aria-label="Filtrar por torre">
            <option value="">Torre</option>
            @for (tower of towers(); track tower) {
              <option [value]="tower">{{ tower }}</option>
            }
          </select>
        </div>
      }
      <div class="col-12 col-lg">
        <div class="input-group">
          <span class="input-group-text">
            <tabler-icon name="search" />
          </span>
          <input
            type="text"
            class="form-control"
            placeholder="Buscar por número de apartamento…"
            [formControl]="searchControl"
          />
        </div>
      </div>
      <div class="col-12 col-lg">
        <app-search-select
          [search]="searchResidents"
          [formControl]="residentControl"
          placeholder="Filtrar por teléfono o nombre del residente…"
          clearLabel="Quitar filtro de residente"
        />
      </div>
    </div>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="items()"
    [paging]="paging()"
    [loading]="loading()"
    [error]="error()"
    [rowKey]="rowKey"
    [actionLink]="detailLink"
    actionIcon="eye"
    (pageChange)="onPageChange($event)"
  />
</div>
