<app-page-header title="Apartamentos" pretitle="Conjunto">
  @if (canImport() || canImportStatements()) {
    <div actions class="d-flex flex-wrap gap-2">
      @if (canImportStatements()) {
        <a routerLink="/apartments/account-statements/import" class="btn">
          <tabler-icon name="receipt" class="me-1" />
          Cargar estados de cuenta
        </a>
      }
      @if (canImport()) {
        <a routerLink="/apartments/import" class="btn">
          <tabler-icon name="upload" class="me-1" />
          Cargar residentes
        </a>
      }
    </div>
  }
</app-page-header>

<div class="card">
  <div class="card-header">
    <div class="row g-2 w-100">
      <!-- Only when the conjunto declared towers: with none there is nothing to
           pick, and a role without `tenant.info` never gets the list at all. -->
      @if (towers().length) {
        <div class="col-12 col-lg-3">
          <select class="form-select" [formControl]="towerControl" aria-label="Filtrar por torre">
            <option value="">Torre</option>
            @for (tower of towers(); track tower) {
              <option [value]="tower">{{ tower }}</option>
            }
          </select>
        </div>
      }
      <!-- "Sin mora" also lists the units that never received an account statement. -->
      <div class="col-12 col-lg-2">
        <select class="form-select" [formControl]="overdueControl" aria-label="Filtrar por mora">
          <option value="">Mora</option>
          <option value="true">En mora</option>
          <option value="false">Sin mora</option>
        </select>
      </div>
      <div class="col-12 col-lg">
        <div class="input-group">
          <span class="input-group-text">
            <tabler-icon name="search" />
          </span>
          <input
            type="text"
            class="form-control"
            placeholder="Buscar por apartamento, placa, parqueadero o depósito…"
            aria-label="Buscar por apartamento, placa, parqueadero o depósito"
            [formControl]="searchControl"
          />
        </div>
      </div>
      <div class="col-12 col-lg">
        <app-search-select
          [search]="searchResidents"
          [formControl]="residentControl"
          placeholder="Filtrar por teléfono o nombre del residente…"
          clearLabel="Quitar filtro de residente"
        />
      </div>
      <!-- Downloads every unit matching the filters above, not only this page.
           Same columns as the account-statement load, so it is re-uploadable. -->
      <div class="col-12 col-lg-auto">
        <button
          type="button"
          class="btn w-100"
          [disabled]="exporting()"
          (click)="exportCsv()"
          title="Descarga torre, apartamento, saldo actual y en mora de los apartamentos filtrados"
        >
          @if (exporting()) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          } @else {
            <tabler-icon name="download" class="me-1" />
          }
          Descargar reporte
        </button>
      </div>
    </div>
  </div>

  <app-data-table
    [columns]="columns()"
    [rows]="items()"
    [paging]="paging()"
    [loading]="loading()"
    [error]="error()"
    [rowKey]="rowKey"
    [sort]="sort()"
    (sortChange)="onSortChange($event)"
    [actionLink]="detailLink"
    actionIcon="eye"
    (pageChange)="onPageChange($event)"
  />
</div>

<!-- Annex cells (ADR-0029). One value per line; several shrink to fit. -->
<ng-template #plateCell let-a>
  <ng-container *ngTemplateOutlet="annexValues; context: { $implicit: plates(a) }" />
</ng-template>
<ng-template #parkingCell let-a>
  <ng-container *ngTemplateOutlet="annexValues; context: { $implicit: a.annexes.parkingSpots }" />
</ng-template>
<ng-template #storageCell let-a>
  <ng-container *ngTemplateOutlet="annexValues; context: { $implicit: a.annexes.storageUnits }" />
</ng-template>

<ng-template #annexValues let-values>
  @if (values.length === 0) {
    <span class="text-secondary">—</span>
  } @else {
    <div [class.annex-values-many]="values.length > 1">
      @for (value of values; track $index) {
        <div>{{ value }}</div>
      }
    </div>
  }
</ng-template>
