<app-page-header [title]="'Mi Conjunto'" [pretitle]="tenantName" />

<app-tenant-info-nav />

<!-- Every tab stays in the DOM: hiding (not destroying) the inactive ones keeps
     unsaved edits alive while the admin jumps between them. -->
<div [class.d-none]="activeTab() !== 'contact'">
  <app-tenant-contact-form />
</div>
<div [class.d-none]="activeTab() !== 'theme'">
  <app-tenant-branding-form />
</div>
<div [class.d-none]="activeTab() !== 'settings'">
  <app-tenant-settings-form />
</div>
