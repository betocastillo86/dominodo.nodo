<ul class="nav nav-bordered mb-3" role="tablist">
  @for (tab of visibleTabs(); track tab.id) {
    <li class="nav-item" role="presentation">
      <a
        class="nav-link"
        routerLinkActive="active"
        [routerLink]="fullLink(tab)"
        role="tab"
      >
        <tabler-icon [name]="tab.icon" class="me-1" />
        {{ tab.label }}
      </a>
    </li>
  }
</ul>
